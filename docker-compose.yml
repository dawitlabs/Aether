# docker compose up -d, then see README "Quickstart (Docker)".
# Needs NEO4J_PASSWORD in .env next to this file.
services:
  neo4j:
    image: neo4j:2026.09.0-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  api:
    build: .
    depends_on: [neo4j, ollama]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: neo4j
      # Not read from .env: the Nix setup's .env points these at 127.0.0.1,
      # which inside this container is the container itself. Edit here to
      # switch providers; keys still come from .env.
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: gpt-oss:120b-cloud
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBED_BASE_URL: http://ollama:11434/v1
      EMBED_MODEL: all-minilm
      EMBED_API_KEY: ${EMBED_API_KEY:-}
    volumes:
      - aether-data:/data
    # Loopback only; put a TLS proxy in front to expose it (docs/DEPLOY.md).
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  neo4j-data:
  ollama:
  aether-data:
