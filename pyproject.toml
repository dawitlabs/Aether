[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "0.1.0"
description = "An evidence-backed collective knowledge engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest",
]
