[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "0.1.0"
description = "An evidence-backed collective knowledge engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "neo4j==6.4.0",
    "python-dotenv==1.2.4",
    "lancedb==0.40.0",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "networkx==3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2==2.13.1",
]
# examples/mcp_server.py only.
mcp = ["mcp==2.3.0"]
